<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff Login | Olivos Medical Center &amp; Spa</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="logo" src="olivos-logo.png" alt="Olivos Medical Center & Spa" />
      <h1>Staff Portal</h1>
      <div class="sub">Olivos Medical Center &amp; Spa</div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-gold">Sign in</button>
        <div>
          <button type="button" id="forgotBtn" class="forgot">Forgot password?</button>
        </div>
        <div class="msg" id="msg"></div>
      </form>

      <div class="login-foot">
        Private staff area. <a href="index.html">Back to website</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-init.js";
    import {
      signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const emailEl = document.getElementById("email");
    const pwEl = document.getElementById("password");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    // Already signed in? Go straight to the portal.
    onAuthStateChanged(auth, (user) => { if (user) location.replace("staff-portal.html"); });

    function show(text, ok) { msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "err"); }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailEl.value.trim(), pw = pwEl.value;
      if (!email || !pw) { show("Please enter your email and password."); return; }
      btn.disabled = true; show("");
      try {
        await signInWithEmailAndPassword(auth, email, pw);
        location.replace("staff-portal.html");
      } catch (err) {
        btn.disabled = false;
        const code = (err && err.code) || "";
        if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found"))
          show("Incorrect email or password.");
        else if (code.includes("too-many-requests"))
          show("Too many attempts. Please wait a moment and try again.");
        else if (code.includes("invalid-email"))
          show("That doesn't look like a valid email.");
        else show("Couldn't sign in. Please try again.");
      }
    });

    document.getElementById("forgotBtn").addEventListener("click", async () => {
      const email = emailEl.value.trim();
      if (!email) { show("Enter your email above first, then tap Forgot password."); return; }
      try {
        await sendPasswordResetEmail(auth, email);
        show("Password reset link sent to " + email + ".", true);
      } catch (err) {
        show("Couldn't send a reset email. Check the address and try again.");
      }
    });
  </script>
</body>
</html>
