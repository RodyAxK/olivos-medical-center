<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff Portal | Olivos Medical Center &amp; Spa</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <img src="olivos-logo.png" alt="Olivos" />
      <div class="t">Olivos Staff Portal<small>Medical Center &amp; Spa</small></div>
    </div>
    <div class="app-user">
      <span class="badge" id="userBadge" style="background:var(--olive)">•</span>
      <span class="who" id="userWho">…</span>
      <button class="btn btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="app-main">
    <div class="panel">
      <div class="big">✅</div>
      <h2>You're signed in</h2>
      <p>Nice — your login is working. This is your private staff area. The full tools are being built next:</p>
      <div style="margin-top:16px">
        <span class="pill">Staff Dashboard &amp; feed</span>
        <span class="pill">Reminders &amp; calendar</span>
        <span class="pill">Admin Board (kanban)</span>
        <span class="pill">Live sync</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const who = document.getElementById("userWho");
    const badge = document.getElementById("userBadge");

    onAuthStateChanged(auth, (user) => {
      if (!user) { location.replace("staff-login.html"); return; }
      const name = user.displayName || user.email || "Staff";
      who.textContent = name;
      badge.textContent = (name[0] || "S").toUpperCase();
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.replace("staff-login.html");
    });
  </script>
</body>
</html>
