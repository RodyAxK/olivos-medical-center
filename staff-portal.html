<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff Dashboard | Olivos Medical Center &amp; Spa</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <img src="olivos-logo.png" alt="Olivos" />
      <div class="t">Staff Dashboard<small>Olivos Medical Center</small></div>
    </div>
    <div class="app-user">
      <a class="btn btn-ghost" id="adminLink" href="staff-admin.html" style="display:none">Admin Board</a>
      <span class="badge" id="userBadge">•</span>
      <span class="who" id="userWho">…</span>
      <button class="btn btn-ghost" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="app-main">
    <div id="errBanner" class="err-banner" style="display:none"></div>

    <!-- Composer -->
    <section class="composer panel">
      <h3>Post to the team</h3>
      <input id="cSubject" class="in" type="text" placeholder="Subject — e.g., Call UnitedHealthcare about J.D.'s claim" />
      <textarea id="cBody" class="in" placeholder="Details / context — for patients use initials + DOB (e.g., J.M. 04/12/1985), not full names"></textarea>
      <div class="composer-row">
        <select id="cCategory" class="in" title="Category"></select>
        <select id="cAssign" class="in" title="For / assigned to"></select>
        <input id="cDue" class="in" type="date" title="Due date" />
        <label class="chk"><input type="checkbox" id="cUrgent" /> Urgent</label>
        <button class="btn btn-gold" id="postBtn" style="width:auto;margin-left:auto">Post</button>
      </div>
    </section>

    <!-- Calendar -->
    <section class="cal panel">
      <div class="cal-head">
        <h3>📅 Due dates</h3>
        <div class="cal-nav">
          <button id="calPrev" title="Previous month">‹</button>
          <span id="calTitle" style="font-weight:700;color:var(--olive-dark);min-width:150px;text-align:center;display:inline-block"></span>
          <button id="calNext" title="Next month">›</button>
        </div>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div id="calDay" class="cal-day"></div>
    </section>

    <!-- Filters -->
    <div class="filters">
      <input id="fSearch" class="in" type="text" placeholder="Search posts…" />
      <select id="fCategory" class="in"></select>
      <select id="fStatus" class="in">
        <option value="">All statuses</option>
        <option value="open">Open</option>
        <option value="inprogress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </div>

    <div id="feed" class="feed"></div>
    <div id="emptyMsg" class="empty" style="display:none">No posts match — or none yet. Post the first one above. 👆</div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
      onSnapshot, query, orderBy, serverTimestamp, increment
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import { ADMINS, CATEGORIES, GROUPS, isAdmin, colorFor } from "./staff-config.js";

    const $ = (id) => document.getElementById(id);
    let ME = null;          // { uid, name, admin, color }
    let POSTS = [];         // live posts
    let USERS = {};         // uid -> {name}
    const commentSubs = {}; // postId -> unsubscribe

    const STATUS = { open: "Open", inprogress: "In Progress", done: "Done" };

    function showErr(msg) { const b = $("errBanner"); b.textContent = msg; b.style.display = "block"; }
    function timeAgo(ts) {
      if (!ts || !ts.toDate) return "just now";
      const s = Math.floor((Date.now() - ts.toDate().getTime()) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return Math.floor(s/60) + "m ago";
      if (s < 86400) return Math.floor(s/3600) + "h ago";
      return ts.toDate().toLocaleDateString();
    }

    // ---------- auth ----------
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.replace("staff-login.html"); return; }
      ME = { uid: user.uid, admin: isAdmin(user.uid), color: colorFor(user.uid),
             name: isAdmin(user.uid) ? ADMINS[user.uid].name : (user.displayName || (user.email||"Staff").split("@")[0]) };
      $("userWho").textContent = ME.name;
      $("userBadge").textContent = (ME.name[0]||"S").toUpperCase();
      $("userBadge").style.background = ME.color;
      if (ME.admin) $("adminLink").style.display = "";
      try {
        const ref = doc(db, "users", ME.uid);
        const snap = await getDoc(ref);
        if (!snap.exists())
          await setDoc(ref, { name: ME.name, email: user.email||"", role: ME.admin?"admin":"staff", color: ME.color, createdAt: serverTimestamp() });
      } catch (e) { console.warn(e); }
      initOptions(); subscribeUsers(); subscribePosts();
    });
    $("logoutBtn").addEventListener("click", async () => { await signOut(auth); location.replace("staff-login.html"); });

    // ---------- dropdowns / filters ----------
    function initOptions() {
      $("cCategory").innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("");
      $("fCategory").innerHTML = `<option value="">All categories</option>` + CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("");
      rebuildAssign();
      ["fSearch","fCategory","fStatus"].forEach(id => $(id).addEventListener("input", renderFeed));
      initCal();
    }
    function rebuildAssign() {
      $("cAssign").innerHTML = GROUPS.map(o => `<option value="${o}"${o === "General" ? " selected" : ""}>For: ${o}</option>`).join("");
    }
    function subscribeUsers() {
      onSnapshot(collection(db, "users"), (snap) => {
        USERS = {}; snap.forEach(d => USERS[d.id] = d.data());
      }, (e) => console.warn(e));
    }

    // ---------- posts ----------
    function subscribePosts() {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snap) => {
        POSTS = []; snap.forEach(d => POSTS.push({ id: d.id, ...d.data() })); renderFeed(); renderCalendar();
      }, (e) => {
        showErr("Can't reach the database. Make sure the Firestore security rules are published (see the setup steps).");
        console.error(e);
      });
    }

    $("postBtn").addEventListener("click", async () => {
      const subject = $("cSubject").value.trim();
      if (!subject) { $("cSubject").focus(); return; }
      const data = {
        subject, body: $("cBody").value.trim(),
        category: $("cCategory").value, assignTo: $("cAssign").value || "General",
        dueDate: $("cDue").value || null, urgent: $("cUrgent").checked,
        status: "open", createdBy: ME.uid, createdByName: ME.name,
        workingOn: null, workingOnName: null, commentCount: 0, createdAt: serverTimestamp()
      };
      $("postBtn").disabled = true;
      try {
        await addDoc(collection(db, "posts"), data);
        $("cSubject").value = ""; $("cBody").value = ""; $("cDue").value = ""; $("cUrgent").checked = false;
      } catch (e) { showErr("Couldn't post. Check the security rules are published."); console.error(e); }
      $("postBtn").disabled = false;
    });

    async function setStatus(id, status) { try { await updateDoc(doc(db,"posts",id), { status }); } catch(e){ console.error(e);} }
    async function toggleClaim(p) {
      const mine = p.workingOn === ME.uid;
      try {
        if (mine) {
          // release: free it up, and if it was in progress from my claim send it back to open
          await updateDoc(doc(db,"posts",p.id), { workingOn:null, workingOnName:null, status: p.status === "done" ? "done" : "open" });
        } else {
          // take it: mark In Progress with my name
          await updateDoc(doc(db,"posts",p.id), { workingOn:ME.uid, workingOnName:ME.name, status: p.status === "done" ? "done" : "inprogress" });
          // if a manager takes it, mirror a copy onto the Admin Board
          if (ME.admin) {
            await setDoc(doc(db,"adminTasks",p.id), {
              fromPostId: p.id, subject: p.subject, body: p.body || "",
              category: p.category || "General", assignTo: p.assignTo || "General",
              dueDate: p.dueDate || null, urgent: !!p.urgent, status: "inprogress",
              takenById: ME.uid, takenByName: ME.name, postedByName: p.createdByName || "—",
              createdAt: serverTimestamp()
            }, { merge:true });
          }
        }
      } catch(e){ console.error(e);}
    }
    async function removePost(id) { if (!confirm("Delete this post?")) return; try { await deleteDoc(doc(db,"posts",id)); } catch(e){ console.error(e);} }

    // ---------- render ----------
    function renderFeed() {
      const feed = $("feed"); feed.innerHTML = "";
      const term = $("fSearch").value.toLowerCase(), fc = $("fCategory").value, fs = $("fStatus").value;
      const list = POSTS.filter(p =>
        (!fc || p.category === fc) && (!fs || p.status === fs) &&
        (!term || (p.subject + " " + (p.body||"")).toLowerCase().includes(term)));
      $("emptyMsg").style.display = list.length ? "none" : "block";
      list.forEach(p => feed.appendChild(card(p)));
    }

    function chip(text, cls) { const s = document.createElement("span"); s.className = "chip " + (cls||""); s.textContent = text; return s; }
    function overdue(p) { return p.dueDate && p.status !== "done" && p.dueDate < new Date().toISOString().slice(0,10); }

    function card(p) {
      const c = document.createElement("div"); c.className = "post" + (p.urgent ? " urgent" : "");
      c.dataset.pid = p.id;
      // top row: chips + status select
      const top = document.createElement("div"); top.className = "post-top";
      const chips = document.createElement("div"); chips.className = "chips";
      chips.appendChild(chip(p.category || "General", "cat"));
      chips.appendChild(chip("For: " + (p.assignTo || "General"), "for"));
      if (p.urgent) chips.appendChild(chip("Urgent", "urg"));
      if (p.dueDate) chips.appendChild(chip((overdue(p) ? "Overdue " : "Due ") + p.dueDate, overdue(p) ? "over" : "due"));
      top.appendChild(chips);
      const sel = document.createElement("select"); sel.className = "status " + p.status;
      Object.entries(STATUS).forEach(([v,l]) => { const o=document.createElement("option"); o.value=v; o.textContent=l; if(v===p.status)o.selected=true; sel.appendChild(o); });
      sel.addEventListener("change", () => setStatus(p.id, sel.value));
      top.appendChild(sel);
      c.appendChild(top);
      // subject + body
      const h = document.createElement("div"); h.className = "post-subject"; h.textContent = p.subject; c.appendChild(h);
      if (p.body) { const b = document.createElement("div"); b.className = "post-body"; b.textContent = p.body; c.appendChild(b); }
      // meta row
      const meta = document.createElement("div"); meta.className = "post-meta";
      const by = document.createElement("span"); by.innerHTML = `Posted by <b>${escapeHtml(p.createdByName||"—")}</b> · ${timeAgo(p.createdAt)}`;
      meta.appendChild(by);
      const claim = document.createElement("button"); claim.className = "linkbtn";
      if (p.workingOn) { claim.textContent = (p.workingOn === ME.uid ? "You're on it — release" : "Working: " + (p.workingOnName||"someone")); }
      else claim.textContent = "I'll take this";
      claim.addEventListener("click", () => toggleClaim(p));
      meta.appendChild(claim);
      const cmt = document.createElement("button"); cmt.className = "linkbtn"; cmt.textContent = "💬 " + (p.commentCount||0);
      cmt.addEventListener("click", () => toggleComments(c, p, cmt));
      meta.appendChild(cmt);
      if (p.createdBy === ME.uid || ME.admin) { const del=document.createElement("button"); del.className="linkbtn del"; del.textContent="Delete"; del.addEventListener("click",()=>removePost(p.id)); meta.appendChild(del); }
      c.appendChild(meta);
      // comments container
      const cc = document.createElement("div"); cc.className = "comments"; cc.style.display = "none"; c.appendChild(cc);
      return c;
    }

    function toggleComments(cardEl, p, btn) {
      const cc = cardEl.querySelector(".comments");
      if (cc.style.display === "none") {
        cc.style.display = "block";
        if (!cc.dataset.init) {
          cc.dataset.init = "1";
          const listEl = document.createElement("div"); listEl.className = "clist"; cc.appendChild(listEl);
          const row = document.createElement("div"); row.className = "crow";
          const inp = document.createElement("input"); inp.className = "in"; inp.placeholder = "Add a comment…";
          const send = document.createElement("button"); send.className = "btn btn-gold"; send.style.width="auto"; send.textContent = "Send";
          const addC = async () => {
            const body = inp.value.trim(); if (!body) return; inp.value = "";
            try {
              await addDoc(collection(db, "posts", p.id, "comments"), { body, authorId: ME.uid, authorName: ME.name, createdAt: serverTimestamp() });
              await updateDoc(doc(db, "posts", p.id), { commentCount: increment(1) });
            } catch (e) { console.error(e); }
          };
          send.addEventListener("click", addC);
          inp.addEventListener("keydown", (e) => { if (e.key === "Enter") addC(); });
          row.appendChild(inp); row.appendChild(send); cc.appendChild(row);
          const q = query(collection(db, "posts", p.id, "comments"), orderBy("createdAt", "asc"));
          commentSubs[p.id] = onSnapshot(q, (snap) => {
            listEl.innerHTML = "";
            snap.forEach(d => { const x=d.data(); const el=document.createElement("div"); el.className="comment";
              el.innerHTML = `<b>${escapeHtml(x.authorName||"—")}</b> <span class="ct">${timeAgo(x.createdAt)}</span><div></div>`;
              el.querySelector("div").textContent = x.body; listEl.appendChild(el); });
          }, (e)=>console.error(e));
        }
      } else { cc.style.display = "none"; }
    }

    // ---------- calendar ----------
    let calYear, calMonth;
    function ymdLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    function initCal() {
      const t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth();
      $("calPrev").addEventListener("click", () => { calMonth--; if (calMonth < 0){ calMonth = 11; calYear--; } $("calDay").style.display="none"; renderCalendar(); });
      $("calNext").addEventListener("click", () => { calMonth++; if (calMonth > 11){ calMonth = 0; calYear++; } $("calDay").style.display="none"; renderCalendar(); });
    }
    function renderCalendar() {
      const grid = $("calGrid"); if (!grid || calYear == null) return;
      grid.innerHTML = "";
      $("calTitle").textContent = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month:"long", year:"numeric" });
      ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d => { const el=document.createElement("div"); el.className="cal-dow"; el.textContent=d; grid.appendChild(el); });
      // group active (not done) posts with due dates by day
      const byDay = {};
      POSTS.forEach(p => { if (p.dueDate && p.status !== "done") (byDay[p.dueDate] = byDay[p.dueDate] || []).push(p); });
      const firstDow = new Date(calYear, calMonth, 1).getDay();
      const days = new Date(calYear, calMonth + 1, 0).getDate();
      const todayStr = ymdLocal(new Date());
      for (let i = 0; i < firstDow; i++){ const b=document.createElement("div"); b.className="cal-cell empty"; grid.appendChild(b); }
      for (let d = 1; d <= days; d++){
        const ds = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const cell = document.createElement("div"); cell.className = "cal-cell";
        if (ds === todayStr) cell.classList.add("today");
        const num = document.createElement("span"); num.className="cal-num"; num.textContent = d; cell.appendChild(num);
        const items = byDay[ds];
        if (items && items.length){
          cell.classList.add("has");
          const over = ds < todayStr, urg = items.some(p => p.urgent);
          const dot = document.createElement("span"); dot.className = "cal-dot" + (over ? " over" : (urg ? " urg" : "")); dot.textContent = items.length; cell.appendChild(dot);
          cell.addEventListener("click", () => showCalDay(ds, items));
        }
        grid.appendChild(cell);
      }
    }
    function showCalDay(ds, items) {
      const box = $("calDay"); box.style.display = "block"; box.innerHTML = "";
      const h = document.createElement("div"); h.className = "cal-day-h"; h.textContent = "Due " + ds + " · " + items.length + " task" + (items.length>1?"s":""); box.appendChild(h);
      items.forEach(p => {
        const r = document.createElement("div"); r.className = "cal-day-item";
        r.appendChild(chip(p.category || "General", "cat"));
        const t = document.createElement("span"); t.textContent = p.subject; r.appendChild(t);
        if (p.workingOnName){ const w=document.createElement("span"); w.style.cssText="margin-left:auto;color:var(--muted);font-size:.8rem"; w.textContent="• "+p.workingOnName; r.appendChild(w); }
        r.addEventListener("click", () => {
          const el = document.querySelector(`.post[data-pid="${p.id}"]`);
          if (el){ el.scrollIntoView({ behavior:"smooth", block:"center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
        });
        box.appendChild(r);
      });
    }

    function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
  </script>
</body>
</html>
